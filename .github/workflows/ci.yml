name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: oxacan_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oxacan_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/oxacan_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w packages/engine
      - run: npm run db:generate -w apps/api
      - run: npm run lint
      - run: npm test
      - run: npm run build -w apps/api && npm run build -w apps/web
